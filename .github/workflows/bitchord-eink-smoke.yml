name: BitChord power-off validation
on:
  push:
    branches: [bitchord-eink-experiment-20261122]
    paths: ['.github/workflows/bitchord-eink-smoke.yml', 'eink-testing/**']
permissions:
  contents: read
  actions: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Correct history-versus-session test assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('eink-poweroff/smoke.py');s=p.read_text()
          before='def power(root, prefix):'
          helper='def has_app_media_session(raw):\n    # Historical Last MediaButtonReceiver and packages= entries are NOT sessions.\n    return bool(re.search(r"(?m)^[ \\t]*package="+re.escape(PKG)+r"[ \\t]*$",raw))\n\n'
          assert s.count(before)==1
          s=s.replace(before,helper+before)
          before="PKG not in media(prefix+'-sessions')"
          assert s.count(before)==1
          s=s.replace(before,"not has_app_media_session(media(prefix+'-sessions'))")
          before="PKG not in media('after-stale-start')"
          assert s.count(before)==1
          s=s.replace(before,"not has_app_media_session(media('after-stale-start'))")
          before="attempted=adb('shell','am','startservice','-n',PKG+'/com.music.bitchord.playback.PlaybackService',check=False)"
          after="probe=subprocess.run(['adb','shell','am','startservice','-n',PKG+'/com.music.bitchord.playback.PlaybackService'],capture_output=True,timeout=35)\n    attempted=probe.stdout+b'\\nSTDERR:\\n'+probe.stderr\n    report['stale_service_probe_delivered']=probe.returncode==0 and b'Error' not in attempted"
          assert s.count(before)==1
          s=s.replace(before,after)
          s=s.replace("report={'physical_device_tested':False,'emulator_api':29,'checks':[]}","report={'physical_device_tested':False,'emulator_api':29,'checks':[],'assertion_correction':'Match actual package= session records, not historical receiver or packages= references.','heap_configuration':'Emulator setup sets 256m heapgrowthlimit and 512m heapsize before restarting Android runtime; adb is unrooted before installing/testing the unmodified APK.'}")
          p.write_text(s)
          pattern=r'(?m)^[ \t]*package=com\.music\.bitchord\.eink[ \t]*$'
          assert re.search(pattern,'    package=com.music.bitchord.eink\n    active=true')
          assert not re.search(pattern,'Last MediaButtonReceiver: com.music.bitchord.eink\n  uid=10146 packages=com.music.bitchord.eink')
          PY
          cat > /tmp/poweroff-validate.sh <<'SH'
          set -euo pipefail
          gh run download 45159184089 --repo "$GITHUB_REPOSITORY" --name BitChord-EInk-beta2-poweroff --dir packages
          APK=$(find packages -name '*universal*.apk' -print -quit)
          test -n "$APK"
          echo "60baa09cb3cce1b600ffc36e8e212345a3440ebec80eb9825f490a972df9c2f0  $APK" | sha256sum -c -
          mkdir -p poweroff-results
          cp eink-poweroff/smoke.py poweroff-results/TEST-SCRIPT.py
          cp .github/workflows/bitchord-eink-smoke.yml poweroff-results/TEST-WORKFLOW.yml
          adb shell getprop > poweroff-results/emulator-properties-before.txt
          # Configure only the disposable emulator. The APK has no root path.
          # This API29 image can start zygote before its qemu heap property lands,
          # leaving a 16 MB ART heap despite later getprop reporting 512m.
          adb root
          adb wait-for-device
          adb shell stop
          adb shell setprop dalvik.vm.heapgrowthlimit 256m
          adb shell setprop dalvik.vm.heapsize 512m
          adb shell start
          for i in $(seq 1 60); do
            if adb shell pm path android 2>/dev/null | grep -q package:; then break; fi
            sleep 2
          done
          sleep 6
          adb unroot
          adb wait-for-device
          adb shell id > poweroff-results/test-shell-identity.txt
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put secure spell_checker_enabled 0
          adb shell getprop > poweroff-results/emulator-properties.txt
          test "$(adb shell getprop dalvik.vm.heapgrowthlimit | tr -d '\r')" = 256m
          sha256sum "$APK" > poweroff-results/TESTED-APK-SHA256.txt
          adb install -g "$APK"
          python eink-poweroff/smoke.py
          SH
      - name: Validate exact unchanged APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 2048M
          heap-size: 512
          disk-size: 4G
          disable-animations: true
          disable-spellchecker: true
          pre-emulator-launch-script: printf '\nvm.heapSize=256\nhw.ramSize=2048\nhw.lcd.width=800\nhw.lcd.height=1280\nhw.lcd.density=240\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -no-metrics
          script: bash /tmp/poweroff-validate.sh
      - name: Retain screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-EInk-beta2-final-validation
          path: poweroff-results/
          if-no-files-found: warn
          retention-days: 14
